name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout path dependencies
        run: |
          sudo mkdir -p /syncthing/Sync/Projects/system /syncthing/Sync/Projects/lib
          sudo chown -R $USER:$USER /syncthing
          git clone --depth 1 https://github.com/Osso/keyring-rs /syncthing/Sync/Projects/system/keyring-rs
          git clone --depth 1 https://github.com/Osso/peercred-ipc /syncthing/Sync/Projects/lib/peercred-ipc

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev llvm libpam0g-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features
